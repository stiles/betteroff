name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-extras
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: uv run pytest

  wheel:
    name: installed-wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: Check package metadata
        run: uvx twine check --strict dist/*
      - name: Wheel ships the catalog and recession dates
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'betteroff/data/catalog.toml'
          python -m zipfile -l dist/*.whl | grep -q 'betteroff/data/recessions.csv'
      - name: Run the installed CLI outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          WHEEL=$(ls "$GITHUB_WORKSPACE"/dist/*.whl)
          uv run --isolated --no-project --with "$WHEEL" betteroff --version
          uv run --isolated --no-project --with "$WHEEL" betteroff search government | grep -q government_policy
          uv run --isolated --no-project --with "betteroff[charts] @ file://$WHEEL" python -c "import betteroff, altair, vl_convert"
