name: Live source check

# Fetches every catalog table from Michigan's site once a week and validates it,
# so layout changes surface here before users hit them. Downloads are never
# committed or uploaded.

on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run pytest -m live -v
      - name: Open an issue on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Live source check failed"
          if gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "An issue is already open."
          else
            gh issue create --title "$TITLE" --body "The weekly check against Michigan's site failed: $RUN_URL"
          fi
