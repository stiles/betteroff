[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "betteroff"
dynamic = ["version"]
description = "Clean data and charts from the Michigan consumer surveys"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matt Stiles" }]
requires-python = ">=3.11"
keywords = ["consumer sentiment", "survey", "economics", "journalism", "university of michigan", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pandas>=2.1",
    "platformdirs>=4",
    "rich>=13.7",
    "typer>=0.15",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
charts = [
    "altair>=6,<7",
    "vl-convert-python>=1.9,<2",
]

[project.urls]
Homepage = "https://github.com/stiles/betteroff"
Documentation = "https://github.com/stiles/betteroff/tree/main/docs"
Issues = "https://github.com/stiles/betteroff/issues"
Changelog = "https://github.com/stiles/betteroff/blob/main/CHANGELOG.md"

[project.scripts]
betteroff = "betteroff.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8",
    "ruff>=0.6",
    "xlwt>=1.3",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/betteroff/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src/betteroff", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/betteroff"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: fetches from the Michigan website; run with -m live"]
addopts = "-m 'not live'"

[tool.mypy]
python_version = "3.11"
packages = ["betteroff"]
mypy_path = "src"
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
