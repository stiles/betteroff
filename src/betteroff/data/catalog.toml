# Index breakdowns: the sentiment, current and expected indexes within respondent
# groups, from Michigan's tables 2n-5b. Each [[breakdowns]] entry becomes one
# catalog entry per index, with an id such as "consumer_sentiment_by_party";
# `betteroff get ICS --by party` resolves to it.
#
# Layout, checked against the historical ("RB") downloads on 2026-10-23: a banner
# row naming the grouping; a row with the three `breakdown_indexes` labels, each
# over its block; then group labels, sometimes split over two rows, ending in the
# "Date of Survey" row. Every block has one column per group in the same order.
# There is no Total, Relative or Cases column and no question wording. `banner`,
# the block labels and each group's `source_label` must match the file exactly
# after collapsing whitespace; the parser fails if they don't.
#
# Group colors are fixed per breakdown rather than taken from the chart theme:
# a light-to-dark ramp for ordered groups (income, age, education), distinct
# Okabe-Ito colors for regions and conventional blue, gray and red for party.
[[breakdown_indexes]]
index = "consumer_sentiment"
source_label = "SENTIMENT INDEX"

[[breakdown_indexes]]
index = "current_conditions"
source_label = "CURRENT INDEX"

[[breakdown_indexes]]
index = "consumer_expectations"
source_label = "EXPECTED INDEX"

[[breakdowns]]
table = "2n"
by = "income"
by_label = "income tercile"
banner = "HOUSEHOLD INCOME TERCILES"
keywords = ["income", "income tercile", "terciles", "low income", "high income", "rich", "poor", "inequality", "table 2n"]
notes = [
    "Each month Michigan splits respondents into three equal-sized groups by reported household income, so the dollar range of each tercile changes from month to month. A tercile is a position within that month's sample, not a fixed income band.",
    "The table doesn't say how respondents who don't report their income are handled, so the terciles' average need not equal the all-households index.",
    "Readings by income start in October 1979.",
]
groups = [
    { id = "bottom_third", label = "Bottom third", source_label = "Bottom Third", color = "#41b6c4" },
    { id = "middle_third", label = "Middle third", source_label = "Middle Third", color = "#225ea8" },
    { id = "top_third", label = "Top third", source_label = "Top Third", color = "#081d58" },
]

[[breakdowns]]
table = "3n"
by = "age"
by_label = "age"
banner = "AGE OF RESPONDENT"
keywords = ["age", "age group", "young", "younger", "old", "older", "seniors", "generation", "table 3n"]
notes = [
    "Groups are the respondent's age when surveyed: 18 to 34, 35 to 54, and 55 and older. Each group is whoever fell in that range that month, so a group's index over time doesn't follow the same people.",
]
groups = [
    { id = "age_18_34", label = "Ages 18-34", source_label = "18-34", color = "#9e9ac8" },
    { id = "age_35_54", label = "Ages 35-54", source_label = "35-54", color = "#6a51a3" },
    { id = "age_55_plus", label = "Ages 55+", source_label = "55+", color = "#3f007d" },
]

[[breakdowns]]
table = "4n"
by = "education"
by_label = "education"
banner = "EDUCATION OF RESPONDENT"
keywords = ["education", "college", "college degree", "high school", "degree", "schooling", "table 4n"]
