notes = [
    "Michigan labels the groups DEM, IND and REP. The current questionnaire asks: \"Generally speaking, do you usually think of yourself as a Republican, a Democrat, an Independent, or what?\" with \"Other\" as a possible answer, and asks independents which party they feel closer to. The table doesn't say how \"Other\" answers or independents who lean toward a party are counted, so the groups' average need not equal the all-households index.",
    "Readings by party are irregular before February 2017: one month in 1980, a few in 1984-85 and 2006, and runs with gaps from 2008 to 2016. Charts start in February 2017 by default; pass --start for the earlier readings, which draw as separate segments or dots.",
    "Values are on the headline index scale (1966 = 100) and are final readings only; there are no preliminary months. Compare a group with the all-households index only for months both cover.",
    "Each group is whoever identified with that party when surveyed. Its size and makeup shift over time, so a change in a group's index can reflect who belongs to the group as well as how its members feel.",
]
